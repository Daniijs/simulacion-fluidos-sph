[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sphfluid"
version = "2.0.0"
description = "GPU fluid simulation with Position Based Fluids, written in Taichi"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Jiménez Soler" }]
dependencies = ["numpy>=1.26", "taichi>=1.7", "scipy>=1.11", "trimesh>=4.0"]

[project.optional-dependencies]
surface = ["pysplashsurf>=0.12"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[project.scripts]
sphfluid = "sphfluid.cli:main"

[tool.setuptools.packages.find]
include = ["sphfluid*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
