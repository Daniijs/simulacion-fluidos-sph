# Final render scene: ~2.25 million particles. Needs a GPU (sphfluid run --arch gpu).
name = "Valle en miniatura"
builder = "valley"

[fluid]
particle_spacing = 0.005

[solver]
iterations = 6
xsph = 0.02
settle_time = 0.4     # deep reservoir: damp the start until it is in hydrostatic equilibrium

[output]
fps = 100          # simulated frames per second: rendered at 30 fps -> 3.3x slow motion
duration = 3.2
directory = "output/valley"

[scene]
seed = 3
breach_time = 0.5   # the dam fails once the reservoir has settled
